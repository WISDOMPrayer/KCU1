<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2026년 1학기 한다부 Award</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&family=Playfair+Display:ital,wght@0,600;1,600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="main.css">
</head>

<body>
    <!-- Fireworks Canvas Background -->
    <canvas id="fireworks-canvas"></canvas>

    <div class="stars-overlay"></div>

    <main class="main-container">
        <header class="header">
            <div class="award-badge">2026 SEMESTER 1</div>
            <h1 class="main-title">2026년 1학기 한다부 Award</h1>
            <p class="subtitle">학부 행사에 적극적으로 참여해주신 분들을 축하하는 뜻깊은 자리입니다.</p>
        </header>

        <section class="button-section">
            <!-- Upper Button: 행사 풀코드 완주상 -->
            <button id="btn-fullcode" class="award-card-btn">
                <span class="card-icon">🏆</span>
                <span class="card-title">행사 풀코드 완주상</span>
                <span class="card-desc">(신년회 or 입학식 + 개강모임 + 모꼬지 참여자)</span>
                <span class="card-hover-border"></span>
            </button>

            <!-- Lower Button: 개근보다 빛난 만남상 -->
            <button id="btn-attendance" class="award-card-btn">
                <span class="card-icon">✨</span>
                <span class="card-title">개근보다 빛난 만남상</span>
                <span class="card-desc">(개강모임 + 모꼬지 참여자)</span>
                <span class="card-hover-border"></span>
            </button>
        </section>

        <footer class="footer">
            <p>© 2026 한다부. All Rights Reserved.</p>
        </footer>
    </main>

    <script src="main.js"></script>
</body>

</html>
